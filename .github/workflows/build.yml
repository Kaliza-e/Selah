name: Cross-Platform Build & Verification

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    name: Build on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: Windows (x64 NSIS + Portable)
            platform: win
            artifact_name: selah-windows-x64
            artifact_patterns: |
              release/*.exe
              release/*.blockmap
              release/SHA256SUMS-windows.txt

          - os: macos-latest
            target: macOS (x64 + arm64 DMG/ZIP)
            platform: mac
            artifact_name: selah-macos-universal
            artifact_patterns: |
              release/*.dmg
              release/*.zip
              release/*.blockmap
              release/SHA256SUMS-macos.txt

          - os: ubuntu-latest
            target: Linux (x64 AppImage + DEB + RPM)
            platform: linux
            artifact_name: selah-linux-x64
            artifact_patterns: |
              release/*.AppImage
              release/*.deb
              release/*.rpm
              release/SHA256SUMS-linux.txt

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            libnotify-bin \
            libnss3 \
            rpm
          sudo apt-get install -y --no-install-recommends libasound2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends libasound2 || true

      - name: Install Node Dependencies (Reproducible)
        run: npm ci

      - name: Run Automated Tests
        run: npm test

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Build Electron & Vite Bundles
        run: npm run build

      - name: Package Windows (NSIS & Portable)
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          npx electron-builder --win --publish never
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -in '.exe', '.msi' }
          if (-not $files) { throw "No Windows installer artifacts produced" }
          $lines = foreach ($f in $files) {
            $h = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($f.Name)"
          }
          $lines | Out-File -FilePath release/SHA256SUMS-windows.txt -Encoding utf8

      - name: Package macOS (DMG & ZIP for x64 + arm64)
        if: matrix.platform == 'mac'
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            export CSC_LINK="${{ secrets.MAC_CSC_LINK }}"
            export CSC_KEY_PASSWORD="${{ secrets.MAC_CSC_KEY_PASSWORD }}"
            export APPLE_ID="${{ secrets.APPLE_ID }}"
            export APPLE_APP_SPECIFIC_PASSWORD="${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}"
            export APPLE_TEAM_ID="${{ secrets.APPLE_TEAM_ID }}"
          else
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
            unset APPLE_ID
            unset APPLE_APP_SPECIFIC_PASSWORD
            unset APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --publish never
          (cd release && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt)

      - name: Package Linux (AppImage, DEB & RPM)
        if: matrix.platform == 'linux'
        run: |
          npx electron-builder --linux --publish never
          (cd release && sha256sum *.AppImage *.deb *.rpm > SHA256SUMS-linux.txt)

      - name: Upload Packaged Installers as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_patterns }}
          if-no-files-found: error
          retention-days: 14
