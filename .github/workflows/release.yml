name: Release Cross-Platform Installers

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'electron.vite.config.*'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment when dispatching manually'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor

permissions:
  contents: write

concurrency:
  group: release-pipeline
  cancel-in-progress: false

jobs:
  verify:
    name: Prepare Version & Quality Gates
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check-version.outputs.should_release }}
      version: ${{ steps.check-version.outputs.version }}
      release_tag: ${{ steps.check-version.outputs.release_tag }}
      release_ref: ${{ steps.check-version.outputs.release_ref }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Resolve & Validate Release Version
        id: check-version
        run: |
          git fetch --tags --force
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            PKG_VERSION=$(node -p "require('./package.json').version")
            APP_CFG_VERSION=$(node -e "const fs=require('fs'); const m=fs.readFileSync('src/shared/appConfig.ts','utf8').match(/version:\s*'([^']+)'/); console.log(m ? m[1] : '');")
            echo "Tag version: $TAG_VERSION | package.json: $PKG_VERSION | appConfig.ts: $APP_CFG_VERSION"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$APP_CFG_VERSION" ]; then
              echo "::error::Version mismatch: git tag ($TAG_VERSION), package.json ($PKG_VERSION), appConfig.ts ($APP_CFG_VERSION)"
              exit 1
            fi
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "release_ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            HEAD_MSG=$(git log -1 --pretty=%B)
            if echo "$HEAD_MSG" | grep -qiE '\[skip release\]|\[skip ci\]'; then
              echo "Commit requests [skip release]/[skip ci]; skipping automated release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            BUMP_TYPE="${{ github.event.inputs.bump || 'patch' }}"
            NEXT_VERSION=$(node -e "
              const { execSync } = require('child_process');
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              const tags = execSync('git tag -l \"v[0-9]*.[0-9]*.[0-9]*\"').toString().trim().split(/\r?\n/).filter(Boolean);
              const parse = v => v.replace(/^v/, '').split('.').map(n => parseInt(n, 10) || 0);
              const cmp = (a, b) => {
                const pa = parse(a), pb = parse(b);
                for (let i = 0; i < 3; i++) {
                  if (pa[i] !== pb[i]) return pa[i] - pb[i];
                }
                return 0;
              };
              let base = pkg.version;
              for (const t of tags) {
                if (cmp(t, base) > 0) base = t.replace(/^v/, '');
              }
              const [maj, min, pat] = parse(base);
              const next = process.argv[1] === 'minor' ? [maj, min + 1, 0] : [maj, min, pat + 1];
              console.log(next.join('.'));
            " "$BUMP_TYPE")

            echo "Auto-bumping release version to $NEXT_VERSION"
            node -e "
              const fs = require('fs');
              const v = process.argv[1];
              const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              pkg.version = v;
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
              if (fs.existsSync('package-lock.json')) {
                const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
                lock.version = v;
                if (lock.packages && lock.packages['']) lock.packages[''].version = v;
                fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
              }
              const cfgPath = 'src/shared/appConfig.ts';
              fs.writeFileSync(cfgPath, fs.readFileSync(cfgPath, 'utf8').replace(/version:\s*'[^']+'/, \"version: '\" + v + \"'\"));
            " "$NEXT_VERSION"

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_tag=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"
            echo "release_ref=v$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Run TypeScript Type Check
        if: steps.check-version.outputs.should_release == 'true'
        run: npm run typecheck

      - name: Run Automated Test Suite
        if: steps.check-version.outputs.should_release == 'true'
        run: npm test

      - name: Build Production Bundles
        if: steps.check-version.outputs.should_release == 'true'
        run: npm run build

      - name: Commit & Tag Release Version
        if: steps.check-version.outputs.should_release == 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${{ steps.check-version.outputs.release_tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/shared/appConfig.ts
          git commit -m "chore(release): $TAG [skip ci]"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"

  build-windows:
    name: Package Windows (NSIS & Portable x64)
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundles
        run: npm run build

      - name: Package Windows Installers
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) {
            Remove-Item Env:CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            $env:CSC_IDENTITY_AUTO_DISCOVERY = "false"
          }
          npx electron-builder --win --publish never
          $exes = Get-ChildItem -Path release -Filter "*.exe" -File
          if ($exes.Count -lt 2) {
            throw "Expected both Setup and Portable .exe installers; found $($exes.Count)"
          }

      - name: Upload Windows Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Package macOS (DMG & ZIP x64 + arm64)
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundles
        run: npm run build

      - name: Package macOS Installers
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            unset CSC_LINK
            unset CSC_KEY_PASSWORD
            unset APPLE_ID
            unset APPLE_APP_SPECIFIC_PASSWORD
            unset APPLE_TEAM_ID
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --publish never
          ls -lh release/*.dmg release/*.zip

      - name: Upload macOS Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Package Linux (AppImage, DEB & RPM x64)
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    # Ubuntu 22.04 ships rpm 4.17, compatible with electron-builder's bundled fpm 1.9.3
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux Packaging Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libarchive-tools \
            libnotify-bin \
            libnss3 \
            rpm
          sudo apt-get install -y --no-install-recommends libasound2t64 2>/dev/null || sudo apt-get install -y --no-install-recommends libasound2 || true

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundles
        run: npm run build

      - name: Package Linux Installers
        run: |
          npx electron-builder --linux --publish never
          ls -lh release/*.AppImage release/*.deb release/*.rpm

      - name: Upload Linux Release Assets
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Verify Checksums & Publish GitHub Release
    needs: [verify, build-windows, build-macos, build-linux]
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main for Manifest Sync
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect Assets, Generate SHA-256 Checksums & Release Manifest
        shell: bash
        run: |
          mkdir -p dist-release
          find artifacts -maxdepth 2 -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" -o -name "*.blockmap" \) -exec mv {} dist-release/ \;
          (
            cd dist-release
            shopt -s nullglob
            files=(*.exe *.dmg *.zip *.AppImage *.deb *.rpm)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "::error::No release installer binaries found in dist-release"
              exit 1
            fi
            sha256sum "${files[@]}" > SHA256SUMS.txt
          )
          cat dist-release/SHA256SUMS.txt

          TAG="${{ needs.verify.outputs.release_tag }}"
          VER="${{ needs.verify.outputs.version }}"
          REPO="${{ github.repository }}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -Fxv "$TAG" | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log "${PREV_TAG}..${TAG}" --pretty=format:"- %s" --no-merges | grep -v '\[skip ci\]' | head -n 20 || true)
          else
            CHANGELOG=$(git log -n 10 --pretty=format:"- %s" --no-merges | grep -v '\[skip ci\]' || true)
          fi
          export CHANGELOG

          node -e "
            const fs = require('fs');
            const path = require('path');
            const tag = process.argv[1];
            const ver = process.argv[2];
            const repo = process.argv[3];
            const changelog = (process.env.CHANGELOG || '').trim() || 'Cross-platform desktop release for Windows, macOS, and Linux.';
            const dir = 'dist-release';
            const sums = {};
            for (const line of fs.readFileSync(path.join(dir, 'SHA256SUMS.txt'), 'utf8').trim().split(/\r?\n/)) {
              const m = line.match(/^([a-f0-9]{64})\s+\*?(.+)$/i);
              if (m) sums[m[2].trim()] = m[1].toLowerCase();
            }
            const files = fs.readdirSync(dir).filter(f => f !== 'release-manifest.json');
            const assets = files.map((name, idx) => ({
              id: idx + 1,
              name,
              size: fs.statSync(path.join(dir, name)).size,
              browser_download_url: 'https://github.com/' + repo + '/releases/download/' + tag + '/' + name
            }));
            const manifest = {
              tag_name: tag,
              name: 'Selah ' + ver,
              published_at: new Date().toISOString(),
              html_url: 'https://github.com/' + repo + '/releases/tag/' + tag,
              body: changelog,
              prerelease: false,
              sha256sums: sums,
              assets
            };
            fs.writeFileSync('release-manifest.json', JSON.stringify(manifest, null, 2) + '\n');
            fs.copyFileSync('release-manifest.json', path.join(dir, 'release-manifest.json'));
          " "$TAG" "$VER" "$REPO"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          name: Selah ${{ needs.verify.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist-release/*

      - name: Sync release-manifest.json to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add release-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): sync release-manifest.json for ${{ needs.verify.outputs.release_tag }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Notify Website Deploy Hook (Optional)
        if: env.VERCEL_HOOK != ''
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          curl -fsS -X POST "$VERCEL_HOOK" || true
